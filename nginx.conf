# ============================================
# Our Space — Nginx Server Block
# ============================================
# Copy to: /etc/nginx/sites-available/ourspace
# Symlink: ln -s /etc/nginx/sites-available/ourspace /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
# ============================================

upstream ourspace_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot will add redirect to 443 here automatically
    # After running: certbot --nginx -d yourdomain.com -d www.yourdomain.com

    root /home/ourspace/app/client/dist;
    index index.html;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- Connection ----
    keepalive_timeout 65;
    client_max_body_size 55m;

    # ---- Static Assets (Vite build output) ----
    # Hashed filenames in /assets/ — cache forever
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- API Proxy ----
    location /api/ {
        proxy_pass http://ourspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # No caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- Uploads Proxy ----
    location /uploads/ {
        proxy_pass http://ourspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media files can be cached
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- SPA Fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- SSL Configuration (Certbot will fill this in) ----
    # Run: certbot --nginx -d yourdomain.com -d www.yourdomain.com
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
